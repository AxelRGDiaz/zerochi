[package]
name = "zerochi"
version = "0.1.0"
description = "Your inbox pet"
authors = ["Zerochi contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zerochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring-core = "1.0.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"
tauri = { version = "~2.12.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-positioner = { version = "2.0.0", features = ["tray-icon"] }
# macOS 27 swallows left clicks with older tray-icon menu attachment (#355/#365).
tray-icon = { version = "0.25.1", default-features = false }
tokio = { version = "1", features = ["time"] }
url = "2.5"
uuid = "1"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain", "protected"] }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSScreen", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = "0.3.2"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter", "bitflags", "std"] }
